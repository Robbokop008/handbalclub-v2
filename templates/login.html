{% extends "base.html" %}

{% block title %}Handbal Sint-Truiden | Login{% endblock %}

{% block content %}
<section class="club-hero">
    <h1>{{ site_teksten.login_hero_titel }}</h1>
    <p>{{ site_teksten.login_hero_subtitel }}</p>
</section>

<section class="section" style="padding-top:0;">
    <div class="auth-card">
        <h2>Welkom terug</h2>
        <form action="{{ url_for('auth.login') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="username">Gebruikersnaam</label>
            <input id="username" type="text" name="username" class="login-input" placeholder="Voer uw gebruikersnaam in" required>

            <label for="password">Wachtwoord</label>
            <input id="password" type="password" name="password" class="login-input" placeholder="••••••••" required>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <button type="submit" class="btn-dark btn login-button">Inloggen</button>
        </form>
        <p class="login-note">Nieuw hier? <a href="{{ url_for('auth.register') }}">Maak een account aan</a></p>
    </div>
</section>
{% endblock %}
